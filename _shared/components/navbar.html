<style>
  /* =====================================================
   MOBILE NAVBAR FIX
   Keeps Consultation CTA visible on mobile
   ===================================================== */

@media (max-width: 768px) {

  .nav {
    width: 100%;
  }

  .nav-inner {
    width: 100%;
    min-width: 0;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .nav-left {
    min-width: 0;
    flex: 1 1 auto;
  }

  .nav-logo {
    max-width: 100%;
  }

  /* Hide desktop navigation links initially */
  .nav-links {
    display: none;
  }

  /* Mobile menu when opened */
  .nav-links.show {
    display: flex;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    width: 100%;
    flex-direction: column;
    gap: 0;
    padding: 12px 16px 18px;
    background: #fff;
    z-index: 9999;
    box-shadow: 0 10px 30px rgba(0,0,0,.12);
  }

  .nav-links.show li {
    width: 100%;
  }

  .nav-links.show a {
    display: block;
    width: 100%;
    padding: 13px 8px;
  }

  /* IMPORTANT: keep CTA visible */
  .nav-right {
    display: flex !important;
    flex: 0 0 auto;
    align-items: center;
    margin-left: auto;
  }

  .nav-cta {
    display: inline-flex !important;
    align-items: center;
    justify-content: center;
    white-space: nowrap;
    width: auto;
    min-width: 0;
    padding: 9px 12px;
    font-size: 11px;
    line-height: 1.2;
    border-radius: 8px;
  }

  .nav-cta .btn-arrow {
    display: inline;
    margin-left: 4px;
  }

  /* Hamburger */
  .nav-mobile-toggle {
    display: flex !important;
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    padding: 8px;
    margin-left: 2px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    z-index: 10001;
  }

  .nav-mobile-toggle span {
    display: block;
    width: 22px;
    height: 2px;
    border-radius: 2px;
  }
}


/* Smaller phones */
@media (max-width: 420px) {

  .nav-inner {
    padding: 8px 10px;
    gap: 5px;
  }

  .nav-logo {
    font-size: 15px;
  }

  .nav-cta {
    padding: 8px 9px;
    font-size: 10px;
  }

  .nav-cta .btn-arrow {
    display: none;
  }

  .nav-mobile-toggle {
    width: 36px;
    height: 36px;
    padding: 6px;
  }

  .nav-mobile-toggle span {
    width: 20px;
  }
}
</style>
<nav class="nav" id="nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="/" class="nav-logo" target="_blank" rel="noopener">
        <span class="nav-logo-fallback">{{SITE.name}}<span>»</span></span>
      </a>
      <ul class="nav-links">
        <li><a href="/" data-nav-link="services">Services</a></li>
        <li><a href="/" data-nav-link="process">How We Work</a></li>
        <li><a href="/" data-nav-link="case-studies">Case Studies</a></li>
        <li><a href="/" data-nav-link="industries">Industries</a></li>
        <li><a href="/" data-nav-link="partners">Partners</a></li>
      </ul>
    </div>
    <div class="nav-right">
      <a href="/#consultation" class="btn btn-primary nav-cta" id="navCta">Book a Free Call Audit <span class="btn-arrow">→</span></a>
    </div>
    <button class="nav-mobile-toggle" aria-label="Open navigation menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</nav>

<script>
(function() {
  var pathSegments = window.location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
  var depth = pathSegments.length;
  var homePrefix = depth === 0 ? '' : Array(depth).fill('..').join('/') + '/';

  var linkMap = {
    'services':     homePrefix + 'services/',
    'process':      homePrefix + '#process',
    'case-studies': homePrefix + 'case-studies/',
    'industries':   homePrefix + 'industries/',
    'partners':     homePrefix + 'partners/',
  };

  // These stay same-page (no target="_blank")
  var samePageLinks = ['process'];

  document.querySelectorAll('a[data-nav-link]').forEach(function(link) {
    var key = link.getAttribute('data-nav-link');
    if (linkMap[key]) {
      link.href = linkMap[key];
      if (samePageLinks.indexOf(key) === -1) {
        link.target = '_blank';
        link.rel = 'noopener';
      }
    }
  });

  // Mobile toggle
  var btn = document.querySelector('.nav-mobile-toggle');
  var links = document.querySelector('.nav-links');
  if (btn && links) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      links.classList.toggle('show');
      btn.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.nav-inner') && links.classList.contains('show')) {
        links.classList.remove('show');
        btn.classList.remove('open');
      }
    });
  }
})();
</script>
<script>
(function () {

  var cta = document.getElementById("navCta");
  if (!cta) return;

  var path = window.location.pathname;

  // If user is on partners page
  if (path.includes("/partners")) {

    // Change text
    cta.innerHTML = 'Register <span class="btn-arrow">→</span>';

    // Scroll to partner form
    cta.href = "#apply";

  } else if (path.includes("/ccaf")) {
    // Default homepage behavior
    cta.innerHTML = 'Register <span class="btn-arrow">→</span>';
    cta.href = "https://rzp.io/rzp/krdN9As";
    
  } else {

    // Default homepage behavior
    cta.innerHTML = 'Book a Free Call Audit <span class="btn-arrow">→</span>';
    cta.href = "/#consultation";

  }

})();
</script>
<script src="../_shared/webhook-tracker.js"></script>
